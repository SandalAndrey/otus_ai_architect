#cloud-config
# Строка выше обязана быть первой: по ней cloud-init опознаёт формат файла.
# Первичная настройка узла. СКЕЛЕТ: не исполнялся.
# Описание - docs/16-delivery-pipeline.md, раздел 1.

package_update: true

packages:
  - docker.io
  - docker-compose-plugin

write_files:
  # Compose-файл кладётся из репозитория при развёртывании, а не генерируется
  # здесь: он один и тот же для стенда и для узла, различие только в значениях
  # переменных.
  - path: /opt/assistant/.env
    permissions: "0600"
    content: |
      RELEASE=${release}
      # Остальные значения приходят из хранилища секретов при старте,
      # в этот файл не записываются.

runcmd:
  - systemctl enable --now docker
  - docker compose -f /opt/assistant/compose.yml up -d

# Чего здесь намеренно нет:
# - установки весов моделей: они монтируются томом и версионируются отдельно;
# - настройки внешнего репозитория пакетов: служебная подсеть без NAT,
#   образы приходят из реестра внутри контура;
# - значений секретов: состояние Terraform и метаданные узла читаются шире,
#   чем хранилище секретов.
